<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="robots" content="noindex, nofollow">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Вітрина">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{desc}}">
<meta property="og:url" content="{{url}}">
<meta name="theme-color" content="#0f1115">
<style>
  :root { color-scheme: light dark; --bg:#f6f7f9; --fg:#0f1115; --mut:#6b7280; --line:#e3e6ea; --card:#fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1115; --fg:#e8eaed; --mut:#9aa1ab; --line:#252a31; --card:#161a20; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); display: flex; flex-direction: column;
         font: 14px/1.5 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { flex: 0 0 auto; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
           padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--card); }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; }
  header .meta { color: var(--mut); font-size: 12px; }
  header .sp { flex: 1 1 auto; }
  header a { color: var(--mut); font-size: 12px; text-decoration: none; }
  header a:hover { color: var(--fg); text-decoration: underline; }
  iframe { flex: 1 1 auto; width: 100%; border: 0; background: var(--card); }
</style>
</head>
<body>
<header>
  <h1>{{title}}</h1>
  <span class="meta">{{project}} · {{date}}{{version_note}}</span>
  <span class="sp"></span>
  <span class="meta">{{expiry_note}}</span>
</header>
<iframe src="{{raw}}" sandbox="allow-scripts allow-popups allow-forms" title="{{title}}"></iframe>
</body>
</html>
