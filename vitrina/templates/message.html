<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root { color-scheme: light dark; --bg:#f6f7f9; --fg:#0f1115; --mut:#6b7280; --line:#e3e6ea; --card:#fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1115; --fg:#e8eaed; --mut:#9aa1ab; --line:#252a31; --card:#161a20; }
  }
  body { background: var(--bg); color: var(--fg); margin: 0; height: 100vh; display: grid; place-items: center;
         font: 15px/1.6 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .box { background: var(--card); border: 1px solid var(--line); border-radius: 14px;
         padding: 30px 34px; max-width: 420px; text-align: center; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  p { color: var(--mut); margin: 0; }
  form { margin-top: 18px; display: flex; gap: 8px; justify-content: center; }
  input { font: inherit; padding: 9px 12px; width: 130px; text-align: center; letter-spacing: 4px;
          border: 1px solid var(--line); border-radius: 9px; background: var(--bg); color: var(--fg); }
  button { font: inherit; padding: 9px 16px; border: 0; border-radius: 9px; cursor: pointer;
           background: #3b6ea5; color: #fff; }
</style>
</head>
<body>
<div class="box">
  <h1>{{heading}}</h1>
  <p>{{body}}</p>
  {{form}}
</div>
</body>
</html>
